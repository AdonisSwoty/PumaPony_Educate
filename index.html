<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#88c9ff"><title>พี่พูม่า & น้องโพนี่ | ผจญภัยเกาะดวงดาว</title><style>
:root{--navy:#29365f;--blue:#546bea;--pink:#f46ca1;--bg:#e8f7ff}*{box-sizing:border-box}body{margin:0;color:var(--navy);font-family:Tahoma,'Noto Sans Thai',sans-serif;background:linear-gradient(#88d6fa,#def5ff 50%,#fff5e8);min-height:100vh}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:4px solid #162b81;outline-offset:3px}.wrap{max-width:1060px;margin:auto;padding:18px 18px 55px}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-size:clamp(17px,3vw,25px);font-weight:900}.pill{background:#ffffffdf;padding:10px 15px;border-radius:40px;font-weight:800;box-shadow:0 5px 16px #3b7ba42b}.btn{background:linear-gradient(145deg,#667ff6,#7360d9);color:#fff;border:0;padding:15px 23px;min-height:54px;border-radius:20px;box-shadow:0 7px 0 #4c54aa;font-weight:900;font-size:17px}.btn:active{transform:translateY(4px);box-shadow:0 3px 0 #4c54aa}.btn.soft{background:white;color:var(--navy);box-shadow:0 6px 0 #cad7e5}.btn.pink{background:linear-gradient(145deg,#ff91bc,#e75c92);box-shadow:0 7px 0 #b84b80}.btn:disabled{opacity:.5;cursor:default}.hero{background:#ffffffae;border:4px solid #fff;border-radius:34px;box-shadow:0 16px 45px #4f7eaa40;padding:clamp(18px,4vw,40px);margin:22px 0;text-align:center;overflow:hidden}.hero h1{font-size:clamp(31px,5vw,59px);margin:8px 0;color:#4359a5}.hero p{font-size:18px;line-height:1.7}.people{display:flex;align-items:flex-end;justify-content:center;gap:34px;margin:12px auto 22px}.person{font-size:clamp(65px,12vw,117px);filter:drop-shadow(0 10px 3px #6484ab50);animation:hop 3s ease-in-out infinite}.person:nth-child(2){animation-delay:.8s}.person b{display:block;font-size:16px;background:white;padding:7px 13px;border-radius:25px;filter:none}.land{height:150px;margin:0 -35px -14px;position:relative;background:radial-gradient(ellipse at 50% 100%,#63ce90 0 57%,transparent 58%),linear-gradient(transparent 65%,#95dbef 66%);display:grid;place-items:center;font-size:56px;letter-spacing:15px}.map{position:relative;border:5px solid white;border-radius:32px;overflow:hidden;min-height:565px;background:linear-gradient(180deg,#76d1f4 0 36%,#7cd5ac 37% 80%,#62bb8c);box-shadow:0 18px 40px #3b7a943c;padding:24px}.map:before{content:'☁️　☁️　　 ☁️';position:absolute;top:24px;left:12%;font-size:44px;opacity:.75}.map:after{content:'🌴　　　 🌳　　　 🌲';position:absolute;bottom:15px;left:2%;font-size:63px;opacity:.82}.map h2{text-align:center;background:#ffffffd9;padding:12px;border-radius:20px;width:fit-content;margin:0 auto;position:relative;z-index:2}.route{position:absolute;left:15%;top:32%;width:70%;height:48%;border:10px dashed #f8e7a1;border-radius:48% 55% 38% 46%;transform:rotate(-11deg);pointer-events:none;opacity:.88}.spots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:60px 10px;position:relative;z-index:2;margin:75px 0 35px}.spot{border:4px solid #fff;background:linear-gradient(160deg,#fffef2,#fff6ca);color:var(--navy);padding:15px 8px;border-radius:28px;box-shadow:0 9px 0 #7fa89f,0 14px 28px #368a7e4d;min-height:126px;transition:transform .2s}.spot:hover:not(:disabled){transform:translateY(-5px)}.spot .emoji{display:block;font-size:52px;line-height:1.2}.spot b{display:block;font-size:15px}.spot small{font-size:12px;display:block;margin-top:4px}.spot.lock{filter:grayscale(.8);opacity:.75}.spot.done{background:#e2ffde;border-color:#fff}.spot:nth-child(4){grid-column:3;grid-row:2}.spot:nth-child(5){grid-column:2;grid-row:2}.spot:nth-child(6){grid-column:1;grid-row:2}.panel{margin-top:22px;background:#ffffffed;border:4px solid white;border-radius:30px;padding:clamp(16px,4vw,33px);box-shadow:0 15px 35px #527ba438}.head{text-align:center}.head h1{margin:8px 0;font-size:clamp(25px,4vw,42px)}.head p{line-height:1.7;font-size:16px}.avatars{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.avatar{padding:9px 14px;border-radius:19px;background:#eef0ff;font-weight:900}.avatar.active{background:#fff1ab;box-shadow:inset 0 0 0 3px #ffcf69}.scene{min-height:190px;background:linear-gradient(180deg,#8edbff 0 55%,#8bd797 56%);border:5px solid white;border-radius:27px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-size:clamp(52px,8vw,87px);padding:16px;margin:20px 0;box-shadow:inset 0 -13px #5cbd85}.question{text-align:center;font-weight:900;font-size:clamp(20px,3vw,26px);margin:14px 0}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:19px auto;max-width:730px}.choice{border:4px solid white;border-radius:24px;background:#f1f7ff;min-height:110px;font-size:clamp(35px,7vw,67px);box-shadow:0 7px 0 #c4d4e9;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;padding:9px}.choice small{font-size:15px;font-weight:900}.choice:active{transform:translateY(4px)}.msg{margin:12px 0;text-align:center;min-height:31px;font-size:18px;font-weight:900;color:#4e62a0}.bottom{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:20px}.reward{font-size:96px;animation:hop 2.5s infinite}.progress{height:14px;background:#dce6f3;border-radius:20px;overflow:hidden;margin:15px auto;max-width:650px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#8adba6,#ffcd68);transition:width .35s}.notice{font-size:13px;text-align:center;color:#63739a;margin:20px}.hidden{display:none!important}@keyframes hop{50%{transform:translateY(-12px)}}@media(max-width:560px){.map{min-height:540px;padding:13px}.spots{gap:50px 7px;margin-top:100px}.spot{min-height:112px;border-radius:20px;padding:8px 2px}.spot .emoji{font-size:38px}.spot b{font-size:12px}.spot small{font-size:10px}.route{border-width:7px}.choices{gap:8px}.choice{min-height:95px;border-radius:18px}.people{gap:12px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}</style></head><body><div class="wrap"><header class="bar"><div class="brand">🧭 พี่พูม่า & น้องโพนี่</div><div class="pill">⭐ ดาวสะสม <span id="stars">0</span>　💎 <span id="gems">0</span>/6</div></header><main id="app"></main><footer class="notice">เล่นได้ทั้งมือถือและคอมพิวเตอร์ • ไม่มีโฆษณา • เล่นได้โดยไม่ต้องใช้อินเทอร์เน็ตหลังเปิดไฟล์</footer></div><script>
(()=>{'use strict';const stages=[{icon:'🌳',name:'ป่ารุ้ง',sub:'ตามหาสี',tasks:[{who:1,scene:'🌳 🌼 🦋',q:'น้องโพนี่ช่วยเลือกสีของดวงอาทิตย์',opts:['🔴','🟡','🔵'],a:1},{who:0,scene:'🌷 🌻 🌷',q:'พี่พูม่าช่วยนับดอกไม้ทั้งหมด',opts:['2','3','4'],a:1}]},{icon:'🌉',name:'สะพานเมฆ',sub:'ข้ามแม่น้ำ',tasks:[{who:1,scene:'🌊 🪨 🌊 🪨',q:'น้องโพนี่เลือกก้อนหินให้ข้ามน้ำ',opts:['🪨','🔥','🌵'],a:0},{who:0,scene:'🌉 ⭐ ⭐ ⭐ ⭐',q:'พี่พูม่านับดาวบนสะพาน',opts:['3','4','5'],a:1}]},{icon:'🐾',name:'ป่าสัตว์',sub:'ช่วยสัตว์',tasks:[{who:1,scene:'🐰 💭',q:'น้องโพนี่เลือกอาหารให้กระต่าย',opts:['🥕','🐟','🍰'],a:0},{who:0,scene:'🐵 🍌 🍌 🍌',q:'พี่พูม่านับกล้วยที่ลิงเก็บได้',opts:['2','3','5'],a:1}]},{icon:'🗝️',name:'ถ้ำลับ',sub:'แก้ปริศนา',tasks:[{who:1,scene:'🔺 🟦 ⭐',q:'น้องโพนี่ช่วยหารูปดาว',opts:['🟦','⭐','🔺'],a:1},{who:0,scene:'🔴 🔵 🔴 🔵 ❓',q:'พี่พูม่าต่อแบบรูปสีที่หายไป',opts:['🔴','🟡','🔵'],a:0}]},{icon:'🚀',name:'หุบเขาจรวด',sub:'เดินทางอวกาศ',tasks:[{who:1,scene:'🚀 🌎 🌙',q:'น้องโพนี่เลือกสิ่งที่ใช้เดินทางสู่อวกาศ',opts:['🚲','🚀','🚗'],a:1},{who:0,scene:'🪐 ⭐ ⭐ ⭐ 🌟',q:'พี่พูม่านับดาวทั้งหมด รวมดาวดวงใหญ่',opts:['3','4','5'],a:1}]},{icon:'🏰',name:'ปราสาทดาว',sub:'เปิดหีบสมบัติ',tasks:[{who:1,scene:'🏰 🔑 💎',q:'น้องโพนี่เลือกกุญแจเปิดปราสาท',opts:['🔑','🍉','🧸'],a:0},{who:0,scene:'💎 💎 ＋ 💎 💎',q:'พี่พูม่าช่วยคิด 2 + 2 เท่ากับเท่าไร',opts:['3','4','5'],a:1}]}];const key='puma_pony_adventure_v2';let save={done:[],stars:0};try{const v=JSON.parse(localStorage.getItem(key)||'{}');if(Array.isArray(v.done))save.done=v.done.filter(i=>Number.isInteger(i)&&i>=0&&i<6);if(Number.isFinite(v.stars))save.stars=Math.max(0,Math.min(9999,v.stars))}catch{}let level=0,task=0,view='home',message='';const app=document.getElementById('app');function persist(){try{localStorage.setItem(key,JSON.stringify(save))}catch{}}function header(){document.getElementById('stars').textContent=save.stars;document.getElementById('gems').textContent=save.done.length}function btn(label,act,more=''){return `<button class="btn ${more}" data-action="${act}">${label}</button>`}function render(){header();if(view==='home'){app.innerHTML=`<section class="hero"><span class="pill">🌈 Adventure Edition</span><h1>ผจญภัยเกาะดวงดาว!</h1><p>ออกเดินทางไปกับ <b>พี่พูม่า</b> และ <b>น้องโพนี่</b><br>ผ่าน 6 ดินแดน เก็บอัญมณีให้ครบ แล้วเปิดปราสาทมหัศจรรย์</p><div class="people"><div class="person">🦊<b>พี่พูม่า</b></div><div class="person">🐰<b>น้องโพนี่</b></div></div>${btn('🗺️ เปิดแผนที่ผจญภัย','map')}<div class="land">🌳 🏠 🌼</div></section>`}else if(view==='map'){app.innerHTML=`<section class="map"><h2>🗺️ แผนที่เกาะดวงดาว</h2><div class="route"></div><div class="spots">${stages.map((s,i)=>{let done=save.done.includes(i),unlocked=i===0||save.done.includes(i-1);return `<button class="spot ${done?'done':''} ${unlocked?'':'lock'}" data-action="enter" data-level="${i}" ${unlocked?'':'disabled'}><span class="emoji">${unlocked?s.icon:'🔒'}</span><b>ด่าน ${i+1} ${s.name}</b><small>${done?'✅ สำเร็จแล้ว':unlocked?s.sub:'ยังไม่ปลดล็อก'}</small></button>`}).join('')}</div></section><div class="bottom">${btn('🏠 กลับหน้าหลัก','home','soft')}${save.done.length===6?btn('🏆 ชมรางวัลใหญ่','final','pink'):''}</div>`}else if(view==='play'){const s=stages[level],t=s.tasks[task];app.innerHTML=`<section class="panel"><div class="head"><div class="pill">${s.icon} ด่าน ${level+1}/6 — ${s.name}</div><h1>ภารกิจ ${task+1}/2</h1><div class="avatars"><div class="avatar ${t.who===0?'active':''}">🦊 พี่พูม่า</div><div class="avatar ${t.who===1?'active':''}">🐰 น้องโพนี่</div></div><div class="progress"><i style="width:${task*50}%"></i></div></div><div class="scene">${t.scene}</div><div class="question">${t.q}</div><div class="choices">${t.opts.map((c,i)=>`<button class="choice" data-action="answer" data-answer="${i}">${c}</button>`).join('')}</div><div class="msg" role="status">${message||'เลือกคำตอบแล้วไปต่อกันเลย!'}</div><div class="bottom">${btn('🗺️ กลับแผนที่','map','soft')}</div></section>`}else if(view==='win'){app.innerHTML=`<section class="panel head"><div class="reward">💎</div><h1>เยี่ยมเลย! ผ่าน${stages[level].name}แล้ว</h1><p>พี่พูม่าและน้องโพนี่ช่วยกันเก่งมาก!<br>ได้รับอัญมณีดวงดาวและดาวรางวัล ⭐</p>${btn('🗺️ ไปแผนที่ผจญภัย','map')}</section>`}else{app.innerHTML=`<section class="panel head"><div class="reward">🏆</div><h1>เปิดปราสาทมหัศจรรย์สำเร็จ!</h1><div class="people"><div class="person">🦊<b>พี่พูม่า</b></div><div class="person">🐰<b>น้องโพนี่</b></div></div><p>คู่หูผู้กล้าเก็บอัญมณีครบ 6 ดวงแล้ว!<br>ขอบคุณที่ช่วยกันคิด ช่วยกันเลือก และออกผจญภัยไปด้วยกัน</p>${btn('🗺️ กลับไปเลือกด่าน','map')} ${btn('🔄 เริ่มผจญภัยใหม่','reset','soft')}</section>`}}function start(i){level=i;task=0;message='';view='play';render()}app.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if(a==='home'||a==='map'||a==='final'){view=a;message='';render()}else if(a==='enter'){const i=+b.dataset.level;if(i===0||save.done.includes(i-1))start(i)}else if(a==='answer'){const t=stages[level].tasks[task];if(+b.dataset.answer!==t.a){message='ลองอีกครั้งนะ! ช่วยกันคิดได้เลย 💛';render();return}save.stars+=2;if(task===0){task=1;message='เก่งมาก! ถึงตาพี่หรือน้องคนถัดไปแล้ว 🎉';persist();render()}else{if(!save.done.includes(level))save.done.push(level);save.done.sort((a,b)=>a-b);persist();view='win';render()}}else if(a==='reset'){if(confirm('เริ่มใหม่และลบรางวัลที่สะสมไว้หรือไม่?')){save={done:[],stars:0};persist();view='home';render()}}});render();})();
</script></body></html>
