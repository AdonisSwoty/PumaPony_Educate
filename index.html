<title>พี่พูม่า & น้องโพนี่ | ผจญภัยเกาะมหัศจรรย์</title>
<style>

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:#c5ecff;color:var(--ink);font-family:ui-rounded,"Trebuchet MS","Noto Sans Thai",Tahoma,Arial,sans-serif;font-weight:700}button{font:inherit;font-weight:900;cursor:pointer;border:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:4px solid #274ba0;outline-offset:4px}button:active:not(:disabled){transform:translateY(3px) scale(.99)}button:disabled{cursor:not-allowed;opacity:.63}#app{min-height:100vh;overflow:hidden;isolation:isolate}.world-bg{position:fixed;z-index:-3;inset:0;pointer-events:none;background:linear-gradient(180deg,#69c4f7 0%,#b7ecfa 46%,#dbf6e4 69%,#f9e9b5 100%)}.world-bg:before,.world-bg:after{content:'☁️';position:absolute;font-size:clamp(64px,9vw,136px);opacity:.57;animation:cloud 21s ease-in-out infinite}.world-bg:before{top:9%;left:3%}.world-bg:after{top:31%;right:3%;animation-delay:-11s}.world-ground{position:fixed;z-index:-2;left:-15%;width:130%;bottom:-18vh;height:36vh;border-radius:50% 50% 0 0;background:radial-gradient(ellipse at 48% 5%,#bcf2a3,#79d9a1 65%,#6abf8f);pointer-events:none;opacity:.65}@keyframes cloud{50%{translate:40px -8px}}.wrap{width:min(1180px,100%);margin:auto;padding:20px 22px 70px}.topbar{display:flex;align-items:center;gap:12px;justify-content:space-between;min-height:68px}.brand{display:flex;align-items:center;gap:12px;color:#293b65;font-weight:1000;font-size:clamp(16px,2.2vw,22px);letter-spacing:-.6px;background:none;text-align:left;padding:0}.brand-coin{display:grid;place-items:center;width:49px;height:49px;background:#fff9dd;border:3px solid #fff;border-radius:17px;box-shadow:0 6px 0 #85c2d1,0 12px 16px #28679525;font-size:27px;rotate:-9deg}.hud{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end}.pill{background:#fffdf5ec;border:2px solid white;box-shadow:0 5px 0 #88c6cc66;padding:10px 14px;border-radius:90px;min-height:45px;color:#34476a;font-size:1 /* Illustrated island: CSS layers create a 2.5D, toy-like feel without downloads */
.hero-art{position:relative;min-height:475px;perspective:900px;filter:drop-shadow(0 28px 22px #28749b36)}.art-sun{position:absolute;top:14px;right:11%;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle at 36% 30%,#fffce3,#ffe18c 66%,#ffba61);box-shadow:0 0 0 17px #fff2a95b,0 0 0 34px #fff4b53c}.spark{position:absolute;font-size:30px;animation:bob 3s ease-in-out infinite}.spark.one{top:19%;left:11%}.spark.two{top:33%;right:5%;animation-delay:-1.3s}.spark.three{left:28%;bottom:22%;animation-delay:-2s}.island-piece{position:absolute;width:94%;left:3%;height:207px;top:45%;border-radius:50%;background:radial-gradient(ellipse at 48% 28%,#c3f58b 0%,#7bd998 62%,#43a978 92%);box-shadow:0 26px 0 #996e56,0 39px 0 #785e55,0 53px 36px #35648034;border:8px solid #a7eeaf;transform:rotate(-4deg)}.island-trail{position:absolute;width:56%;height:45px;border-radius:50%;left:22%;top:64%;background:#fce5a4;transform:rotate(-12deg);opacity:.9;box-shadow:inset 0 -9px 0 #eecf8c}.toy-house{position:absolute;top:19%;left:34%;width:180px;height:174px;transform:rotate(3deg)}.toy-roof{position:absolute;width:194px;height:115px;top:0;left:-7px;background:linear-gradient(145deg,#ff9ab3,#f05b87);clip-path:polygon(50% 0,100% 70%,88% 79%,50% 31%,12% 79%,0 70%);filter:drop-shadow(0 10px 0 #cb4f7b)}.toy-wall{position:absolute;bottom:0;left:19px;width:141px;height:111px;border-radius:12px 12px 20px 20px;background:linear-gradient(105deg,#fff3c9,#eab58c);border:6px solid #fff4dd;box-shadow:inset -14px -5px 0 #dca980}.toy-door{position:absolute;bottom:0;left:61px;width:43px;height:64px;background:#8e72e9;border:5px solid #785ccc;border-radius:24px 24px 3px 3px}.toy-door:before{content:'';position:absolute;right:5px;top:24px;background:#fff29b;border-radius:50%;width:6px;height:6px}.toy-window{position:absolute;top:21px;left:15px;width:31px;height:29px;border-radius:9px;border:5px solid #fff5ca;background:#92dbfc}.toy-tree{position:absolute;font-size:106px;top:30%;left:6%;filter:drop-shadow(0 12px 0 #5ba778)}.toy-tree.right{top:38%;left:auto;right:0%;font-size:86px}.hero-duo{position:absolute;bottom:14%;left:18%;right:11%;display:flex;justify-content:space-between;align-items:flex-end;gap:20px}.mascot{display:flex;flex-direction:column;align-items:center;position:relative;animation:bob 3.3s ease-in-out infinite;filter:drop-shadow(0 14px 8px #285f5360)}.mascot.pony{animation-delay:-1.3s}.mascot .face{width:111px;height:120px;display:grid;place-items:center;font-size:79px;border-radius:38px;background:linear-gradient(150deg,#fffefb,#e3e7fa);border:6px solid #fff;box-shadow:0 9px 0 #9fc0c0,0 13px 20px #2c6a6b41;position:relative}.mascot.pony .face{width:95px;height:105px;font-size:74px;background:linear-gradient(150deg,#ffe8f5,#fffafa)}.mascot .neck-tag{font-size:13px;background:#fff;box-shadow:0 4px 0 #b3d7d8;border-radius:99px;padding:6px 13px;margin-top:-4px;z-index:2;white-space:nowrap}.mascot .shadow{height:12px;width:90px;background:#315f4642;border-radius:50%;position:absolute;bottom:-17px;z-index:-1}@keyframes bob{50%{transform:translateY(-10px) rotate(2deg)}}.section-head{text-align:center;margin:20px 0 22px}.section-head h2{font-size:clamp(27px,3.4vw,39px);margin:6px 0;font-weight:1000}.section-head p{color:#526b83;line-height:1.8;margin:0;font-size:16px}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.feature{background:#fffdf7db;border:3px solid white;padding:21px;border-radius:23px;box-shadow:0 7px 0 #a0d4d6;font-size:14px;line-height:1.7}.feature .fi{font-size:34px;margin-bottom:6px}.feature strong{display:block;font-size:18px;color:#35476a}.feature p{margin:4px 0;color:#63748b}.footer-note{text-align:center;color:#55748d;font-size:13px;line-height:1.8;margin:35px auto}
/* Adventure atlas */
.map-hero{display:flex;gap:20px;align-items:flex-end;justify-content:space-between;margin:26px 0 17px}.map-hero h1,.heading h1{font-size:clamp(32px,4vw,48px);margin:5px 0 6px;line-height:1.3}.map-hero p,.heading p{color:#526b88;font-size:16px;line-height:1.7;margin:0}.map-side{display:flex;gap:7px;font-size:37px;white-space:nowrap}.atlas{border:5px solid #fffaf2;background:linear-gradient(165deg,#dcfaff80,#d7f7ca77 48%,#fae9bc9e);border-radius:35px;box-shadow:0 14px 0 #a2d9ce,0 21px 36px #355f9b24;padding:28px;position:relative;overflow:hidden}.atlas:before{content:'☁️';position:absolute;font-size:110px;right:-15px;top:-30px;opacity:.28}.atlas:after{content:'🌴';position:absolute;bottom:-37px;left:-35px;font-size:120px;opacity:.27}.map-route{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;position:relative;z-index:1}.level-card{position:relative;border:4px solid #fffdfa;background:linear-gradient(160deg,var(--from),var(--to));border-radius:27px;min-height:220px;color:#2a3c62;text-align:center;padding:12px 10px 15px;box-shadow:0 8px 0 var(--edge),0 14px 20px #3d5b7330;transition:transform .18s,filter .18s}.level-card:hover:not(:disabled){transform:translateY(-7px)}.level-card.locked{filter:saturate(.38);opacity:.67;background:#e6e9ea}.level-card.done{border-color:#ffefa4}.level-card .level-index{position:absolute;top:10px;left:10px;background:#ffffffc9;padding:4px 9px;border-radius:99px;font-size:12px}.level-card .level-status{position:absolute;top:9px;right:10px;font-size:20px}.level-card .level-art{display:block;font-size:clamp(58px,7vw,88px);line-height:1.18;margin:19px 0 9px;filter:drop-shadow(0 9px 3px #4654712c)}.level-card strong{display:block;font-size:clamp(16px,1.6vw,19px)}.level-card small{display:block;font-size:12px;line-height:1.7;color:#4a5f80;margin-top:6px}.level-card .hero-flag{position:absolute;top:-18px;right:-7px;background:#fff;border:2px solid #ffe3a7;border-radius:99px;padding:7px;font-size:14px;box-shadow:0 5px 0 #fff4ba}.map-legend{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;margin-top:19px;color:#4b6381;font-size:13px}.map-guide{background:#fffdf9d9;border:2px solid white;border-radius:18px;margin-top:18px;padding:14px 18px;color:#3c5872;font-size:14px;line-height:1.75}
/* Game scene */
.game-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0}.crumb{background:#fff9e7f0;padding:9px 15px;border:2px solid white;border-radius:99px;font-size:14px}.back{background:#fffdf5;color:#435878;box-shadow:0 5px 0 #acced3;padding:12px 16px;border-radius:16px;min-height:48px;font-size:14px}.heading{margin:14px 0 18px;text-align:center}.heading .kicker{background:#fffdf5;border:2px solid white;padding:8px 13px;border-radius:99px;display:inline-flex;font-size:13px}.quest{background:#fffcf8ee;border:4px solid white;border-radius:34px;box-shadow:0 12px 0 #add7dc,0 22px 30px #26558430;overflow:hidden}.quest-world{--quest-sky:#a2dcff;min-height:225px;background:linear-gradient(180deg,var(--quest-sky),#dcf8ee 74%,#bde7ae);display:flex;align-items:center;justify-content:center;flex-direction:column;padding:22px 16px 16px;position:relative;overflow:hidden}.quest-world:before{content:'';position:absolute;width:120%;height:112px;background:#9add9a;bottom:-58px;border-radius:50%;border-top:10px solid #b7efaa}.quest-world:after{content:'☁️';position:absolute;top:6px;right:10%;font-size:45px;opacity:.5}.quest-world .landmark{font-size:clamp(83px,11vw,130px);line-height:1.15;position:relative;z-index:1;filter:drop-shadow(0 12px 5px #356b6b32)}.quest-world .scene-buddies{position:absolute;left:16px;bottom:13px;display:flex;gap:7px;font-size:36px;z-index:2;filter:drop-shadow(0 4px 0 #385c5970)}.scene-caption{position:relative;z-index:2;background:#fffefaab;color:#455776;padding:7px 16px;border-radius:99px;margin-top:3px;font-size:14px}.quest-progress{display:flex;justify-content:center;align-items:center;gap:9px;padding:16px 20px 0}.progress-node{height:11px;flex:1;max-width:88px;background:#e0e8e9;border-radius:99px}.progress-node.on{background:#ffbb5b}.progress-node.complete{background:#5bc6a8}.quest-body{max-width:850px;margin:auto;padding:23px 27px 31px}.role{display:flex;align-items:center;gap:11px;background:#f4f1ff;border:2px solid #e7e1ff;border-radius:17px;padding:11px 14px;color:#594c84;margin-bottom:16px;font-size:14px}.role .role-face{font-size:30px}.role.pony{background:#fff0f7;border-color:#ffd9e9;color:#a6507b}.task-title{font-size:clamp(23px,3vw,31px);line-height:1.45;margin:6px 0 3px;color:#303d64;text-align:center}.task-hint{text-align:center;color:#65738e;line-height:1.65;margin:0 auto 20px;font-size:15px}.answers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:18px auto}.answers.four{grid-template-columns:repeat(4,minmax(0,1fr))}.answer{min-height:120px;background:linear-gradient(155deg,#fffef9,#f6f4ff);border:3px solid #dcdffd;border-radius:23px;color:#324468;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:7px;box-shadow:0 7px 0 #c6c9ed,0 13px 15px #5669a322;transition:.15s;padding:11px}.answer:hover:not(:disabled){background:#fff5c9;transform:translateY(-4px);border-color:#ffdb81}.answer .answer-icon{font-size:clamp(34px,5vw,53px);line-height:1.2}.answer .answer-text{font-size:clamp(15px,2vw,22px);line-height:1.25}.answer .answer-sub{font-size:13px;color:#63718a}.answer.wrong{animation:wiggle .3s ease-in-out;border-color:#ff9caa;background:#fff0f3}@keyframes wiggle{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}.answer.correct{background:#e1fae9;border-color:#5fce93}.feedback{min-height:46px;border-radius:15px;background:#f0f6fa;border:2px solid #e7eef2;padding:11px 15px;color:#547086;font-size:15px;text-align:center;margin-top:15px;line-height:1.5}.feedback.good{background:#e8fae9;border-color:#a4e6c5;color:#307757}.feedback.try{background:#fff2dc;border-color:#ffdc9d;color:#956037}.count-art{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;font-size:clamp(41px,6vw,61px);min-height:92px;background:#f4faff;border:2px dashed #bfdde7;border-radius:22px;padding:12px}.number-path{display:flex;justify-content:center;align-items:center;gap:8px;margin:17px auto;flex-wrap:wrap}.stone{display:grid;place-items:center;border:3px solid #fffef6;border-radius:20px;background:#e9f1dc;box-shadow:0 6px 0 #abcb9b;min-width:68px;height:76px;font-size:32px;color:#3c6283}.stone.missing{background:#ffedaa;border:3px dashed #edb96d;box-shadow:0 6px 0 #d9b96d}.word-card{text-align:center;background:linear-gradient(145deg,#e9efff,#fff0fc);border:3px solid white;box-shadow:0 5px 0 #ddd9f1;border-radius:24px;padding:17px;margin:12px auto 18px;max-width:330px}.word-card strong{font-size:clamp(44px,8vw,70px);line-height:1.2;letter-spacing:2px;color:#6b59c9}.word-card span{display:block;color:#6671a2;font-size:14px;margin-top:2px}.sound-btn{padding:11px 18px;min-height:48px;background:#ffffff;color:#5a53a7;border:3px solid #dcd5ff;box-shadow:0 5px 0 #d1cbf2;border-radius:16px;margin:5px auto;display:flex}.shape-scene{display:flex;justify-content:center;align-items:center;gap:16px;min-height:113px;background:#eef8ee;border:2px dashed #aed6c5;border-radius:22px;padding:16px;margin:12px auto;font-size:60px}.shape-slot{width:95px;height:83px;display:grid;place-items:center;background:#fffdfb;border:3px dashed #b7cad5;border-radius:19px;color:#bbc4d7;font-size:49px}.shape-progress{display:flex;gap:9px;justify-content:center;font-size:33px;min-height:47px}.memory-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:550px;margin:16px auto 10px}.memory-card{aspect-ratio:1.24;border-radius:21px;border:3px solid #e8d6f7;box-shadow:0 7px 0 #d7c1e9;display:grid;place-items:center;font-size:clamp(42px,6vw,68px);background:linear-gradient(145deg,#ffdaeb,#f9b2d5);transition:.2s}.memory-card.closed{background:linear-gradient(145deg,#9988ec,#726bdc);color:white;font-size:47px}.memory-card.matched{background:#ddf8e1;border-color:#9ed5aa;box-shadow:0 7px 0 #a6dfb8}.maze-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;max-width:450px;margin:10px auto 17px;padding:10px;background:#d6edf1;border:4px solid #b3d8dc;border-radius:25px}.maze-cell{aspec ];

 {word:'CAT',meaning:'แมว',answer:'🐱',choices:[['🐶','DOG'],['🐱','CAT'],['🐰','RABBIT']]},

 {word:'สี่เหลี่ยม',shape:'■',answer:'square',shapeIcon:'🟦',choices:[['circle','🟡','วงกลม'],['square','🟦','สี่เหลี่ยม'],['star','⭐','ดาว']]}

 {title:'ต่อแบบรูปให้ถูกต้อง',subtitle:'ดูให้ดี สิ่งต่อไปคืออะไร?',display:'⭐ 🌙 ⭐ 🌙 ?',answer:'⭐',choices:[['🌙','🌙',''],['🌼','🌼',''],['⭐','⭐','']]}
];

function load(){try{const v=JSON.parse(localStorage.getItem(STORE)||'{}');return {done:Array.isArray(v.done)?v.done.filter(n=>Number.isInteger(n)&&n>=0&&n<7):[],stars:Math.min(9999,Math.max(0,Number(v.stars)||0)),sound:!!v.sound}}catch(_){return {done:[],stars:0,sound:false}}}
const saveState=load();let st={view:'home',level:0,step:0,done:[...new Set(saveState.done)],stars:saveState.stars,sound:saveState.sound,feedback:'',feedbackKind:'',lock:false,shapes:[],deck:[],open:[],matched:[],mazePos:[0,0],mazeKey:false,mazeVisited:['0,0'],mazeStep:0,wrongValue:null};let timer=null;const root=document.getElementById('root');
function persist(){try{localStorage.setItem(STORE,JSON.stringify({done:st.done,stars:st.stars,sound:st.sound}))}catch(_){}}

function header(){return `<header class="topbar"><button class="brand" data-action="home" aria-label="ไปหน้าหลัก"><span class="brand-coin">🧭</span><span>พี่พูม่า & น้องโพนี่</span></button><div class="hud"><div class="pill" aria-label="ดาวสะสม">⭐ <strong>${st.stars}</strong></div><div class="pill" aria-label="คริสตัลสะสม">💎 <strong>${st.done.length}/7</strong></div><button class="pill action" data-action="sound" aria-label="เปิดหรือปิดเสียง">${st.sound?'🔊':'🔇'}</button></div></header>`}
function sceneDuo(){return `<div class="hero-duo"><div class="mascot tiger"><div class="face">🐯</div><span class="neck-tag">พี่พูม่า</span><i class="shadow"></i></div><div class="mascot pony"><div class="face">🐴</div><span class="neck-tag">น้องโพนี่</span><i class="shadow"></i></div></div>`}
function homeView(){return `<div class="wrap"><div class="stage-shell">${header()}<section class="hero"><div class="intro"><span class="eyebrow">🌈 เกมผจญภัยฝึกทักษะสำหรับพี่น้อง</span><h1>พี่พูม่า <em>&</em><br>น้องโพนี่<br><em>ตะลุยเกาะมหัศจรรย์!</em></h1><p>สองคู่หูออกตามหาคริสตัลทั้ง 7 ดินแดน ผ่านป่า ข้ามสะพาน ไขปริศนา ฝึกเลข คำศัพท์อังกฤษ รูปทรง และช่วยกันหาสมบัติ!</p><button class="btn" data-action="map">🗺️ ${st.done.length?'ผจญภัยต่อเลย':'เริ่มออกผจญภัย'} ➜</button><div class="tags"><span>🐯 พี่ 7–8 ปี</span><span>🐴 น้อง 3–5 ปี</span><span>🤝 เล่นด้วยกัน</span><span>📵 เล่นออฟไลน์</span></div></div><div class="hero-art" role="img" aria-label="เกาะสามมิติจำลองที่มีบ้าน ต้นไม้ เสือพูม่า และม้าโพนี่"><div class="art-sun"></div><span class="spark one">✨</span><span class="spark two">⭐</span><span class="spark three">💫</span><div class="island-piece"></div><div class="island-trail"></div><div class="toy-tree">🌳</div><div class="toy-tree right">🌴</div><div class="toy-house"><div class="toy-wall"><div class="toy-door"></div><div class="toy-window"></div></div><div class="toy-roof"></div></div>${sceneDuo()}</div></section><section><div class="section-head"><h2>🎒 7 ดินแดน 7 การผจญภัย</h2><p>เกมหลายแบบ ทั้งแตะเลือก จับคู่ พลิกการ์ด เดินเขาวงกต และไขรหัส</p></div><div class="features"><div class="feature"><div class="fi">🔢</div><strong>เก่งเลขและภาษาอังกฤษ</strong><p>ฝึกนับ เรียงเลข เรียนศัพท์ง่าย ๆ พร้อมปุ่มออกเสียงคำศัพท์</p></div><div class="feature"><div class="fi">🧩</div><strong>คิดและจดจำ</strong><p>เลือกรูปทรง พลิกการ์ดจับคู่ ฝึกสังเกตและแก้ปัญหา</p></div><div class="feature"><div class="fi">🤝</div><strong>เล่นด้วยกันจริง ๆ</strong><p>ผลัดกันเลือก ช่วยคิดและบอกทาง ไม่มีจับเวลาหรือแพ้</p></div></div></section><p class="footer-note">💛 ไม่มีโฆษณา • ไม่เก็บข้อมูลส่วนตัว • บันทึกความคืบหน้าไว้เฉพาะอุปกรณ์นี้</p></div></div>`}
const unlocked=i=>i===0||st.done.includes(i-1);

function gameInner(){const lv=LEVELS[st.level],s=st.step;
 if(lv.type==='colors'){let t=COLOR_TASKS[s];return `${roleTag('pony',lv.role)}<h2 class="task-title">${t.prompt}</h2><p class="task-hint">สังเกตชื่อสีและภาพ แล้วแตะสิ่งของที่ถูกต้อง</p>${options(t.choices)}`}
 if(lv.type==='numbers'){let t=NUM_TASKS[s];return `${roleTag('tiger',lv.role)}<h2 class="task-title">${t.title}</h2><p class="task-hint">มองทางเดินหิน แล้วเลือกตัวเลขมาเติมช่องว่าง</p><div class="number-path">${t.path.map(n=>`<span class="stone ${n==='?'?'missing':''}">${n}</span>`).join('')}</div>${options(t.choices.map(n=>[n,'🔢',n]))}`}
 if(lv.type==='english'){let t=ENG_TASKS[s];return `${roleTag('tiger',lv.role)}<h2 class="task-title">ภาพไหนตรงกับคำศัพท์นี้?</h2><div class="word-card"><strong>${t.word}</strong><span>แปลว่า “${t.meaning}”</span></div><button class="sound-btn" data-action="speak" data-word="${t.word}">🔊 ฟังคำว่า ${t.word}</button><p class="task-hint">ให้น้องโพนี่เลือกรูปที่ตรงกับคำศัพท์ภาษาอังกฤษ</p>${options(t.choices.map(c=>[c[0],c[0],c[1]]))}`}
 if(lv.type==='shapes'){let t=SHAPE_TASKS[s];return `${roleTag('pony',lv.role)}<h2 class="task-title">ตามหารูป${t.word}</h2><p class="task-hint">เลือกรูปทรงให้ตรง เพื่อสร้างวิหารแห่งรูปทรง</p><div class="shape-scene">🏛️ <span class="shape-slot">?</span></div><div class="shape-progress">${st.shapes.join(' ')}</div>${options(t.choices)}`}
 if(lv.type==='memory'){return `${roleTag('pony',lv.role)}<h2 class="task-title">เปิดการ์ดหาภาพที่เหมือนกัน!</h2><p class="task-hint">ผลัดกันเปิดการ์ดทีละใบ จับคู่ให้ครบ 3 คู่ (${st.matched.length/2}/3)</p><div class="memory-grid">${st.deck.map((icon,i)=>{const visible=st.open.includes(i)||st.matched.includes(i);return `<button class="memory-card ${visible?'':'closed'} ${st.matched.includes(i)?'matched':''}" data-action="flip" data-index="${i}" ${st.lock||visible?'disabled':''} aria-label="${visible?'รูป '+icon:'การ์ดปิด หมายเลข '+(i+1)}">${visible?icon:'❔'}</button>`}).join('')}</div>`}
 if(lv.type==='maze'){return `${roleTag('tiger',lv.role)}<h2 class="task-title">เดินเก็บ 🗝️ แล้วไปที่ 🚪</h2><p class="task-hint">ใช้ลูกศรพาพี่พูม่าและน้องโพนี่ผ่านเขาวงกต ห้ามเดินทะลุก้อนหิน!</p><div class="maze-grid" role="group" aria-label="เขาวงกตห้าคูณห้าช่อง">${MAZE.flatMap((row,y)=>row.map((cell,x)=>{const here=st.mazePos[0]===y&&st.mazePos[1]===x;const icon=here?'🐯':cell==='#'?'🪨':cell==='K'?(st.mazeKey?'✨':'🗝️'):cell==='E'?'🚪':st.mazeVisited.includes(y+','+x)?'🐾':'';return `<span class="maze-cell ${cell==='#'?'wall':''} ${cell==='E'?'exit':''} ${st.mazeVisited.includes(y+','+x)?'visited':''}" aria-label="${here?'พี่พูม่าอยู่ที่นี่':cell==='#'?'หิน':cell==='K'?'กุญแจ':cell==='E'?'ประตู':'ทางเดิน'}">${icon}</span>`})).join('')}</div><div class="controls"><button class="arrow up" data-action="move" data-dir="up" aria-label="ขึ้น">↑</button><button class="arrow left" data-action="move" data-dir="left" aria-label="ซ้าย">←</button><button class="arrow down" data-action="move" data-dir="down" aria-label="ลง">↓</button><button class="arrow right" data-action="move" data-dir="right" aria-label="ขวา">→</button></div><div class="maze-message">${st.mazeKey?'🔑 ได้กุญแจแล้ว! ไปหาประตูเลย':'🔎 ยังไม่ได้กุญแจ • ใช้ปุ่มลูกศรหรือคีย์บอร์ด'}</div>`}
 let t=FINAL_TASKS[s];return `${roleTag(s%2?'pony':'tiger',lv.role)}<h2 class="task-title">${t.title}</h2><p class="task-hint">${t.subtitle}</p><div class="count-art">${t.display}</div>${options(t.choices)}`;
}
function playView(){const lv=LEVELS[st.level];const completed=lv.type==='memory'?st.matched.length/2:lv.type==='maze'?(st.mazeKey?1:0):st.step;return `<div class="wrap"><div class="stage-shell">${header()}<div class="game-top"><button class="back" data-action="map">← แผนที่</button><span class="crumb">🗺️ ด่าน ${st.level+1} / ${LEVELS.length}</span></div><div class="heading"><span class="kicker">${lv.icon} ผจญภัยครั้งที่ ${st.level+1}</span><h1>${lv.name}</h1><p>${lv.story}</p></div><section class="quest"><div class="quest-world" style="--quest-sky:${lv.sky}"><span class="landmark" aria-hidden="true">${taskVisual(lv)}</span><div class="scene-buddies" aria-hidden="true">🐯 🐴</div><span class="scene-caption">${lv.short}</span></div>${progress(lv.total,completed)}<div class="quest-body">${gameInner()}<div class="feedback ${st.feedbackKind}" role="status" aria-live="polite">${st.feedback||'✨ ค่อย ๆ คิดแล้วช่วยกันตอบได้เลย ไม่มีจับเวลา!'}</div><p class="help-text">💛 พี่พูม่าช่วยคิด • น้องโพนี่ช่วยเลือก • ตอบผิดลองใหม่ได้เสมอ</p></div></section></div></div>`}
function completionView(){const all=st.done.length===LEVELS.length;return `<div class="wrap"><div class="stage-shell">${header()}<div class="quest sparkle-bg" style="margin-top:40px"><div class="complete-panel"><div class="stars-fx">${all?'👑':'💎'}</div><h1>${all?'ปลดล็อกสมบัติสำเร็จ!':'เยี่ยมเลย! ผ่านภารกิจแล้ว'}</h1><div class="complete-duo"><span>🐯</span><span>🐴</span></div><p>${all?'พี่พูม่ากับน้องโพนี่ช่วยกันเก็บคริสตัลครบ 7 ชิ้นแล้ว! ทุกด่านบนเกาะเปิดให้กลับไปเล่นได้อีก':'พี่พูม่ากับน้องโพนี่เก่งมาก! ได้คริสตัลอีกหนึ่งชิ้น เดินทางต่อสู่ดินแดนใหม่กันเลย'}</p><span class="trophy">💎 ${st.done.length} / 7 คริสตัล · ⭐ ${st.stars} ดาว</span><div class="complete-buttons"><button class="btn light" data-action="map">🗺️ กลับแผนที่</button>${!all?`<button class="btn orange" data-action="next">ผจญภัยต่อ ➜</button>`:'<button class="btn pink" data-action="replay">🎮 เล่นด่านสุดท้ายอีกครั้ง</button>'}</div></div></div></div></div>`}
function draw(){root.innerHTML=st.view==='home'?homeView():st.view==='map'?mapView():st.view==='play'?playView():completionView()}
function goHome(){clearTimer();st.view='home';st.lock=false;draw();window.scrollTo(0,0)}
function goMap(){clearTimer();st.view='map';st.lock=false;draw();window.scrollTo(0,0)}
function shuffle(a){let r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}
function startLevel(i){if(!unlocked(i))return;clearTimer();st.level=i;st.step=0;st.shapes=[];st.feedback='';st.feedbackKind='';st.lock=false;st.wrongValue=null;st.deck=shuffle(['🐯','🐴','🌟','🐯','🐴','🌟']);st.open=[];st.matched=[];st.mazePos=[0,0];st.mazeVisited=['0,0'];st.mazeKey=false;st.mazeStep=0;st.view='play';draw();window.scrollTo(0,0);announce(LEVELS[i].story)}
function reward(n){st.stars=Math.min(9999,st.stars+n);persist()}
function finish(){clearTimer();if(!st.done.includes(st.level)){st.done.push(st.level);reward(8)}st.view='complete';st.lock=false;st.feedback='';persist();draw();window.scrollTo(0,0);announce('เก่งมาก ภารกิจสำเร็จแล้ว')}
function goodThen(next){st.feedback='🎉 ถูกต้องเลย! พี่พูม่ากับน้องโพนี่สุดยอด!';st.feedbackKind='good';st.wrongValue=null;st.lock=true;reward(2);draw();announce('เก่งมาก ถูกต้องแล้ว');timer=setTimeout(()=>{timer=null;next()},850)}
function nextStep(){st.step++;st.feedback='';st.feedbackKind='';st.lock=false;if(st.step>=LEVELS[st.level].total){finish();return}draw()}
function tryAnswer(value){if(st.lock)return;let lv=LEVELS[st.level];let expected=lv.type==='colors'?COLOR_TASKS[st.step].answer:lv.type==='numbers'?NUM_TASKS[st.step].answer:lv.type==='english'?ENG_TASKS[st.step].answer:lv.type==='shapes'?SHAPE_TASKS[st.step].answer:lv.type==='final'?FINAL_TASKS[st.step].answer:null;if(value===expected){if(lv.type==='shapes')st.shapes.push(SHAPE_TASKS[st.step].shapeIcon);goodThen(nextStep)}else{st.feedback='💡 เกือบแล้ว! ลองสังเกตอีกครั้งนะ';st.feedbackKind='try';st.wrongValue=value;draw();announce('ลองอีกครั้งนะ')}}
function flipCard(i){if(st.lock||st.open.includes(i)||st.matched.includes(i))return;st.open.push(i);st.feedback='';st.feedbackKind='';if(st.open.length===2){st.lock=true;const [a,b]=st.open;if(st.deck[a]===st.deck[b]){st.matched.push(a,b);st.feedback='⭐ จับคู่สำเร็จ เก่งมาก!';st.feedbackKind='good';reward(3);draw();timer=setTimeout(()=>{timer=null;st.lock=false;st.open=[];if(st.matched.length===6)finish();else draw()},680)}else{st.feedback='🔎 ภาพยังไม่เหมือนกัน ลองจำตำแหน่งแล้วเปิดใหม่';st.feedbackKind='try';draw();timer=setTimeout(()=>{timer=null;st.open=[];st.lock=false;draw()},1000)}}else draw()}
function move(dir){if(st.lock)return;const ds={up:[-1,0],down:[1,0],left:[0,-1],right:[0,1]};const v=ds[dir];if(!v)return;const y=st.mazePos[0]+v[0],x=st.mazePos[1]+v[1];if(y<0||y>=5||x<0||x>=5||MAZE[y][x]==='#'){st.feedback='🪨 ทางนี้ไปไม่ได้! ลองเลี้ยวไปทางอื่น';st.feedbackKind='try';draw();return}st.mazePos=[y,x];const key=y+','+x;if(!st.mazeVisited.includes(key))st.mazeVisited.push(key);if(MAZE[y][x]==='K'&&!st.mazeKey){st.mazeKey=true;st.feedback='🗝️ ได้กุญแจแล้ว! ตอนนี้ต้องหาประตู';st.feedbackKind='good';reward(3);announce('ได้กุญแจแล้ว')}else if(MAZE[y][x]==='E'){if(st.mazeKey){st.feedback='🏰 เปิดประตูได้แล้ว!';st.feedbackKind='good';st.lock=true;reward(4);draw();timer=setTimeout(()=>{timer=null;finish()},650);return}else{st.feedback='🔒 ประตูล็อกอยู่ ต้องหา 🗝️ ก่อน';st.feedbackKind='try'}}else{st.feedback='🐾 เดินต่อไปได้เลย!';st.feedbackKind=''}draw()}
root.addEventListener('click',ev=>{const b=ev.target.closest('button[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;if(action==='home')return goHome();if(action==='map')return goMap();if(action==='sound'){st.sound=!st.sound;persist();draw();if(st.sound)announce('เปิดเสียงแล้ว');else if('speechSynthesis'in window)speechSynthesis.cancel();return}if(action==='level')return startLevel(Number(b.dataset.index));if(action==='choose')return tryAnswer(decodeURIComponent(b.dataset.value));if(action==='flip')return flipCard(Number(b.dataset.index));if(action==='move')return move(b.dataset.dir);if(action==='speak')return announce(b.dataset.word,true);if(action==='next')return startLevel(Math.min(6,st.level+1));if(action==='replay')return startLevel(st.level);if(action==='reset'){if(window.confirm('ต้องการเริ่มเกมใหม่และลบดาวกับคริสตัลที่สะสมบนอุปกรณ์นี้ใช่ไหม?')){clearTimer();st.done=[];st.stars=0;persist();goMap()}}});
document.addEventListener('keydown',ev=>{if(st.view!=='play'||st.level!==5)return;let dir={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'}[ev.key];if(dir){ev.preventDefault();move(dir)}});
draw();
})();
</script>
</body>
</html>
